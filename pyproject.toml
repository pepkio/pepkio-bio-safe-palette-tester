[project]
name = "pepkio-bio-safe-palette-tester"
version = "0.1.0"
description = "Python client for Pepkio bio-safe-palette-tester tool"
readme = "README_PYPI.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-bio-safe-palette-tester = "pepkio_bio_safe_palette_tester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_bio_safe_palette_tester"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
